<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#15171b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Climb Tracker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Climb Tracker</title>
</head>
<body>
  <header class="topbar"><h1 id="pageTitle">Climb Tracker</h1><button id="pageAction" class="icon-btn hidden" aria-label="Settings">⚙︎</button></header>
  <main id="app" class="content"></main>
  <nav class="tabbar" aria-label="Main navigation">
    <button data-tab="log" class="tab active"><span>⌂</span><small>Log</small></button>
    <button data-tab="projects" class="tab"><span>★</span><small>Projects</small></button>
    <button data-tab="stats" class="tab"><span>▥</span><small>Stats</small></button>
    <button data-tab="body" class="tab"><span>◉</span><small>Body</small></button>
  </nav>
  <dialog id="modal"></dialog>
  <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
  <script src="app.js"></script>
</body>
</html>
